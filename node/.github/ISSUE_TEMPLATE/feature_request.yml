name: QDAY feature request
description: Propose a change to the QDAY node or wallet
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        Search existing QDAY issues before opening another request.
  - type: textarea
    id: feature-description
    attributes:
      label: Description
      description: |
        A description of the feature you want added
        Tip: You can attach images by clicking this area and then dragging files in.
      placeholder: Tell us what you want! Be as descriptive as possible.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: What QDAY version are you running?
      placeholder: v1.0.0
    validations:
      required: false
  - type: input
    id: os
    attributes:
      label: What operating system are you running (e.g. Ubuntu 22.04, macOS, Windows 11)?
    validations:
      required: false
  - type: textarea
    attributes:
      label: Anything else?
      description: |
        Links? References? Anything that will give us more context about the feature!
        Tip: You can attach images or log files by clicking this area to highlight it and then dragging files in.
    validations:
      required: false
