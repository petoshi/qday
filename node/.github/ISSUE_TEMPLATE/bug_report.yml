name: QDAY bug report
description: Report a reproducible QDAY node or wallet problem
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Search existing QDAY issues first. Never attach a seed phrase, wallet
        key, API token or password.
  - type: textarea
    id: current-behavior
    attributes:
      label: Current Behavior
      description: A concise description of what you're experiencing.
      placeholder: Tell us what you see!
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: A concise description of what you expected to happen.
      placeholder: Tell us what you want to see!
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
  - type: input
    id: version
    attributes:
      label: Version
      description: What QDAY version are you running? For a source build, include the commit hash.
      placeholder: v1.0.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: What operating system did the problem occur on (e.g. Ubuntu 22.04, macOS 12.0, Windows 11)?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Anything else?
      description: |
        Links? References? Anything that will give us more context about the issue you are encountering!
        Tip: You can attach images or log files by clicking this area to highlight it and then dragging files in.
    validations:
      required: false
